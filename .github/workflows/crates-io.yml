name: Publish to crates.io

"on":
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the package without uploading it
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: crates-io
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Inspect package contents
        run: cargo package --list --locked
      - name: Validate crates.io package
        run: cargo publish --dry-run --locked --registry crates-io
      - name: Publish to crates.io
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "Add the CARGO_REGISTRY_TOKEN repository secret before publishing." >&2
            exit 1
          fi
          cargo publish --locked --registry crates-io
