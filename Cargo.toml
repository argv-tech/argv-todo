[package]
name = "argv-todo"
version = "0.1.0"
edition = "2024"
description = "A minimal Vim-style terminal todo app with nested tasks and SQLite storage"
license = "MIT"
repository = "https://github.com/argv-tech/argv-todo"
homepage = "https://github.com/argv-tech/argv-todo"
readme = "README.md"
keywords = ["todo", "tui", "terminal", "sqlite", "vim"]
categories = ["command-line-utilities"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md"]

[dependencies]
anyhow = "1"
crossterm = "0.29"
dirs = "6"
ratatui = "0.30.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
toml = { version = "1.0", default-features = false, features = ["std", "parse", "serde"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"
